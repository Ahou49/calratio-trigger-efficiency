    #FlavourTaggingEventSF:
    #  - containerName: 'AnaJets'#.baselineJvt'
    #    btagger: 'GN2v01'
    #    btagWP: 'Continuous'
  - containerName: 'EMPFlowJets'
    jetCollection: 'AntiKt4EMPFlowJets'
    PtEtaSelection:
        minPt: 25000.0
        maxEta: 2.5
    Uncertainties:
        systematicsModelJES: 'Category'
        systematicsModelJER: 'Full'
    FlavourTagging:
      - btagger: 'GN2v01'
        btagWP: 'Continuous'
      - btagger: 'GN2v01'
        btagWP: 'FixedCutCEff_50'
        useCTagging: True
      - btagger: 'GN2v01'
        btagWP: 'FixedCutCEff_30'
        useCTagging: True
      - btagger: 'GN2v01'
        btagWP: 'FixedCutCEff_10'
        useCTagging: True
      - btagger: 'GN2v01'
        btagWP: 'Continuous2D'
    FlavourTaggingEventSF:
      - containerName: 'EMPFlowJets'
        btagger: 'GN2v01'
        btagWP: 'Continuous2D'


Electrons:
  - containerName: 'AnaElectrons'
    crackVeto: True
    IFFClassification: {}
    writeTrackD0Z0: True
    ESModel: ''
    WorkingPoint:
      - selectionName: 'loose'
        identificationWP: 'TightLH'
        isolationWP: 'NonIso'
        trackSelection: True
        #noEffSF: True
      - selectionName: 'tight'
        identificationWP: 'TightLH'
        isolationWP: 'Tight_VarRad'
        trackSelection: True
        #noEffSF: True
    PtEtaSelection:
        minPt: 27000.0
        maxEta: 2.47
        useClusterEta: True

Muons:
  - containerName: 'AnaMuons'
    IFFClassification: {}
    writeTrackD0Z0: True
    WorkingPoint:
      - selectionName: 'loose'
        quality: 'Medium'
        isolation: 'NonIso'
        trackSelection: True
      - selectionName: 'tight'
        quality: 'Medium'
        isolation: 'Tight_VarRad'
        systematicBreakdown: True
        trackSelection: True
    PtEtaSelection:
        minPt: 25000.0
        maxEta: 2.5

InDetTracks:
  - inputContainer: 'InDetTrackParticles'
    containerName: 'AnaTracks'
    runBiasing: False
    minPt: 500
    maxEta: 2.5
    outputTrackSummaryInfo: True
    

MissingET:
  - containerName: 'AnaMET'
    jets: 'AnaJets'
    electrons: 'AnaElectrons.tight'
    muons: 'AnaMuons.tight'
    useJVT: False
    # the following is needed to overwrite the settings when using EMTopo jets (do not have NNJVT)
    # mind the usage of enableExpertMode in the CommonServices above
    propertyOverrides: {
      "MetMakerAlg.makerTool.JetSelection": "Expert",
      "MetMakerAlg.makerTool.CustomJetJvtWP": "None"
    }

# Note: so far, OR done against EMTopo jets only
OverlapRemoval:
  inputLabel: 'preselectOR'
  outputLabel: 'passesOR'
  jets: 'AnaJets'#.baselineJvt'
  electrons: 'AnaElectrons.tight'
  muons: 'AnaMuons.tight'
  #enableUserPriority: False

ObjectCutFlow:
  - containerName: 'AnaElectrons'
    selectionName: 'tight'
  #- containerName: 'AnaJets'
  #  selectionName: 'baselineJvt'
  - containerName: 'AnaMuons'
    selectionName: 'tight'

Thinning:
  - containerName: 'AnaJets'
    outputName: 'OutJets'
    #selectionName: 'baselineJvt'
  - containerName: 'AnaElectrons'
    outputName: 'OutElectrons'
    selectionName: 'tight||loose'
  - containerName: 'AnaMuons'
    outputName: 'OutMuons'
    selectionName: 'tight||loose'
  - containerName: 'EMPFlowJets'
    outputName: 'OutPFlowJets'
  - containerName: 'AnaTracks'
    outputName: 'OutTracks'

