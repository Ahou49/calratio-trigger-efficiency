EventCleaning:
  runEventCleaning: False
  runGRL: True
  userGRLFiles:
    - 'GoodRunsLists/data22_13p6TeV/20250321/data22_13p6TeV.periodAllYear_DetStatus-v134-pro28-09_MERGED_PHYS_StandardGRL_All_Good_25ns.xml'
    - 'GoodRunsLists/data23_13p6TeV/20250321/data23_13p6TeV.periodAllYear_DetStatus-v133-pro31-11_MERGED_PHYS_StandardGRL_All_Good_25ns.xml'
    - 'GoodRunsLists/data24_13p6TeV/20241118/physics_25ns_data24.xml'
    - 'GoodRunsLists/data25_13p6TeV/20260129/physics_25ns_data25_periodsDEFKMOQ.xml'
  GRLDict: {}

# ToDo: for different signatures, cf. Marion + Frederic mods.
EventSelection:
  - electrons: 'AnaElectrons.loose'
    muons: 'AnaMuons.tight'
    jets: 'AnaJets'#.baselineJvt'
    met: 'AnaMET'
    #btagDecoration: 'ftag_select_GN2v01_FixedCutBEff_85'
    noFilter: True 
    cutFlowHistograms: True
    selectionCutsDict: 
      'charmingALP_ttbar_ALP_semilep': |
        SUM_EL_N_MU_N tight tight 27000 25000 == 1
        MET >= 30000
        MET+MWT >= 50000
        JET_N 25000 >= 3
        SAVE
      'DisplacedTop_Hss': |
        JET_N 70000 >= 2
        JET_N 80000 >= 1
        SAVE


# ToDo: revisit and split into reco and truth
TopCalRatio: 
- electrons: 'AnaElectrons'
  muons: 'AnaMuons'
  met: 'AnaMET'
  topojets: 'AnaJets'
  empflowjets: 'EMPFlowJets'
  indettracks: 'AnaTracks'
  selection: 'pass_charmingALP_ttbar_ALP_semilep_%SYS%,as_char||pass_DisplacedTop_Hss_%SYS%,as_char'
  priVtx: 'PrimaryVertices'
  secVtx: 'VrtSecInclusive_SecondaryVertices'


GeneratorLevelAnalysis:
- saveCutBookkeepers: True


LeptonSF:
- muons: 'AnaMuons.tight'
  lepton_postfix: 'tight'


# After configuring each container, many variables will be saved automatically.
Output:
  treeName: 'reco'
  vars:
    - 'EventInfo.lumiBlock -> lumiBlock'

    # AntiKt4EMTopoJetsAuxDyn
    # this can change based on sys?
    - 'OutJets_%SYS%.SumPtTrkPt500 -> EMTopoJet_sumPtTrk_%SYS%'
    - 'OutJets_%SYS%.DFCommonJets_jetClean_LooseBadLLP -> EMTopoJet_isClean_LooseBadLLP_%SYS%'
    - 'OutJets_%SYS%.NumTrkPt500 -> EMTopoJet_NumTrkPt500_%SYS%'
    
    # AntiKt4EMPFlowJetsAuxDyn
    - 'OutPFlowJets_%SYS%.SumPtTrkPt500 -> EMPFlowJet_sumPtTrk_%SYS%'
    - 'OutPFlowJets_%SYS%.DFCommonJets_jetClean_LooseBadLLP -> EMPFlowJet_isClean_LooseBadLLP_%SYS%'
    - 'OutPFlowJets_%SYS%.NumTrkPt500 -> EMPFlowJet_NumTrkPt500_%SYS%'

    # for now just nominal, not sure if more than that needed here
    - 'PrimaryVertices.vertexType -> priVtx_type'
    - 'PrimaryVertices.x -> priVtx_x'
    - 'PrimaryVertices.y -> priVtx_y'
    - 'PrimaryVertices.z -> priVtx_z'
    - 'PrimaryVertices.trackParticleLinks -> priVtx_vertexTrackParticleLinks'
    - 'PrimaryVertices.vertexLinkToInDetTrackParticle -> priVtx_vertexLinkToInDetTrackParticle type=unsigned'

    - 'VrtSecInclusive_SecondaryVertices.vertexType -> secVtx_type'
    - 'VrtSecInclusive_SecondaryVertices.x -> secVtx_x'
    - 'VrtSecInclusive_SecondaryVertices.y -> secVtx_y'
    - 'VrtSecInclusive_SecondaryVertices.z -> secVtx_z'
    - 'VrtSecInclusive_SecondaryVertices.trackParticleLinks -> secVtx_vertexTrackParticleLinks'
    - 'VrtSecInclusive_SecondaryVertices.vertexLinkToInDetTrackParticle -> secVtx_vertexLinkToInDetTrackParticle type=unsigned'

  metVars: []
  containers:
      # Format should follow: '<suffix>:<output container>'
      el_: 'OutElectrons'
      mu_: 'OutMuons'
      EMTopoJet_: 'OutJets'
      EMPFlowJet_: 'OutPFlowJets'
      met_: 'AnaMET'
      trk_: 'OutTracks'
      '': 'EventInfo'
      priVtx_: 'PrimaryVertices'
      secVtx_: 'VrtSecInclusive_SecondaryVertices'

  commands:
    # Turn output branches on and off with 'enable' and 'disable'
    #- disable EMTopoJet_.*_eff.*
    # this can not be disabled anymore, as it does not even exist given expert mode changes above
    #- disable EMTopoJet_jvtEfficiency.*
    - disable EMPFlowJet_jvtEfficiency.*

AddConfigBlocks:
    - modulePath: 'TopCalRatio.TopCalRatioConfig'
      functionName: 'TopCalRatioConfig'
      algName: 'TopCalRatio'
      pos: 'Output'
